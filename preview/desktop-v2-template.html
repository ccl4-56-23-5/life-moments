<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生活点滴 相册</title>
<style>
:root{color-scheme:light dark}
body{margin:0}
#photoindex-desktop{--bg:light-dark(#ffffff,#17191c);--surface:light-dark(#f8fafd,#22252a);--text:light-dark(#202124,#e8eaed);--muted:light-dark(#626870,#aeb4bf);--line:light-dark(#e5e8ed,#373c44);--selected:light-dark(#d3e3fd,#263f63);--blue:light-dark(#174ea6,#adc8f8);--button:light-dark(#0b57d0,#a8c7fa);--onbutton:light-dark(#ffffff,#062e6f);--hover:light-dark(#edf0f5,#303640);font-family:'Segoe UI','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);min-height:100dvh;isolation:isolate}
#photoindex-desktop *{box-sizing:border-box}
#photoindex-desktop [hidden]{display:none!important}
#photoindex-desktop button,#photoindex-desktop input,#photoindex-desktop textarea{font:inherit;color:inherit}
#photoindex-desktop button{border:0;background:transparent;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:10px 15px;cursor:pointer;white-space:nowrap}
#photoindex-desktop button:hover{background:var(--hover)}
#photoindex-desktop button:disabled{opacity:.35;cursor:default}
#photoindex-desktop button:focus-visible,#photoindex-desktop input:focus-visible,#photoindex-desktop textarea:focus-visible{outline:2px solid var(--button);outline-offset:3px}
#photoindex-desktop .iconbutton{padding:10px;width:40px;height:40px;flex-shrink:0}
#photoindex-desktop .primary{background:var(--button);color:var(--onbutton)}
#photoindex-desktop .primary:hover{filter:brightness(.96);background:var(--button)}
#photoindex-desktop .textbutton{color:var(--blue)}
#photoindex-desktop svg.lucide{width:20px;height:20px;stroke-width:1.8;flex-shrink:0}
#photoindex-desktop h1{font-size:25px;line-height:1.35;font-weight:400;margin:0}
#photoindex-desktop h2{font-size:17px;font-weight:500;margin:0}
#photoindex-desktop .topbar{display:flex;gap:24px;align-items:center;height:76px;padding:12px 28px 12px 20px;background:var(--surface)}
#photoindex-desktop .brand{display:flex;gap:13px;align-items:center;min-width:192px;font-size:21px;letter-spacing:1px}
#photoindex-desktop .brandmark{color:var(--button);display:grid;place-items:center}
#photoindex-desktop .brandmark svg{width:29px;height:29px}
#photoindex-desktop .searchbox{display:flex;align-items:center;gap:12px;background:var(--hover);border-radius:28px;padding:0 18px;height:50px;max-width:640px;flex:1;min-width:0}
#photoindex-desktop .searchbox input{width:100%;border:0;background:transparent;padding:10px 0;outline-offset:0}
#photoindex-desktop .searchbox input:focus-visible{outline:0}
#photoindex-desktop .topactions{display:flex;gap:6px;margin-left:auto}
#photoindex-desktop .workspace{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:calc(100dvh - 76px)}
#photoindex-desktop .sidebar{background:var(--surface);padding:14px 14px 24px 12px;display:flex;flex-direction:column;gap:28px}
#photoindex-desktop .navigation{display:grid;gap:4px}
#photoindex-desktop .navigation button{justify-content:flex-start;gap:18px;padding:13px 22px;border-radius:28px;width:100%}
#photoindex-desktop .navigation button[aria-current=page]{background:var(--selected);color:var(--blue);font-weight:500}
#photoindex-desktop .sidesection{margin:0 14px 11px;font-size:12px;color:var(--muted)}
#photoindex-desktop .source{margin:0 14px;font-size:13px;display:grid;gap:9px}
#photoindex-desktop .source span{display:flex;gap:10px;align-items:center}
#photoindex-desktop .source small{color:var(--muted);font-size:11px;overflow-wrap:anywhere;line-height:1.8}
#photoindex-desktop .sidefooter{margin-top:auto;padding:16px 6px 0;display:grid;gap:4px;border-top:1px solid var(--line)}
#photoindex-desktop .sidefooter button{justify-content:flex-start;font-size:13px}
#photoindex-desktop .main{padding:29px 34px 34px;min-width:0}
#photoindex-desktop .pagehead{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:29px;flex-wrap:wrap}
#photoindex-desktop .pagehead .subtitle{font-size:13px;color:var(--muted);margin-top:7px}
#photoindex-desktop .segments{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:23px;padding:3px}
#photoindex-desktop .segments button{min-width:47px;font-size:13px;padding:7px 13px}
#photoindex-desktop .segments button[aria-pressed=true]{background:var(--selected);color:var(--blue)}
#photoindex-desktop .months{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin:0 0 27px}
#photoindex-desktop .months button{padding:6px 11px;font-size:12px;color:var(--muted)}
#photoindex-desktop .months button[aria-pressed=true]{background:var(--selected);color:var(--blue)}
#photoindex-desktop .grouphead{display:flex;align-items:center;gap:12px;margin:25px 0 15px}
#photoindex-desktop .grouphead small{font-size:12px;color:var(--muted)}
#photoindex-desktop .photo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-bottom:26px}
#photoindex-desktop .photo-tile{display:block;padding:0;border-radius:3px;overflow:hidden;aspect-ratio:1.08;background:var(--surface);position:relative}
#photoindex-desktop .photo-tile img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;transition:filter .12s}
#photoindex-desktop .photo-tile:hover img{filter:brightness(.93)}
#photoindex-desktop .photo-tile[data-orientation=portrait]{aspect-ratio:.88}
#photoindex-desktop .photo-tile .tagdot{position:absolute;bottom:7px;right:7px;background:#202124b8;color:#fff;border-radius:20px;padding:3px 6px;display:flex;align-items:center;font-size:11px;gap:3px}
#photoindex-desktop .photo-tile .tagdot svg{width:13px;height:13px}
#photoindex-desktop .samplelabel{font-size:11px;color:var(--muted);margin-top:32px}
#photoindex-desktop .album-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 20px}
#photoindex-desktop .album-card{display:block;text-align:left;padding:0;border-radius:10px;overflow:hidden;white-space:normal}
#photoindex-desktop .album-card img{width:100%;aspect-ratio:1.1;object-fit:cover;border-radius:10px;display:block;background:var(--surface)}
#photoindex-desktop .album-card .title{margin-top:12px;font-size:15px;font-weight:500}
#photoindex-desktop .album-card .summary{color:var(--muted);font-size:12px;margin-top:3px}
#photoindex-desktop .album-note{padding:14px 0 24px;max-width:660px;color:var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
#photoindex-desktop .person-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:25px}
#photoindex-desktop .person-card{display:flex;flex-direction:column;gap:9px;white-space:normal;border-radius:12px;padding:15px}
#photoindex-desktop .person-avatar{width:83px;height:83px;border-radius:50%;background:var(--selected);color:var(--blue);display:grid;place-items:center;font-size:27px;overflow:hidden}
#photoindex-desktop .person-card small{color:var(--muted);font-size:12px}
#photoindex-desktop .person-avatar canvas{width:100%;height:100%;display:block}
#photoindex-desktop .person-tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:3px}
#photoindex-desktop .person-tag{font-size:11px;color:var(--blue);background:var(--selected);border-radius:12px;padding:2px 8px}
#photoindex-desktop .tagfilters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 28px}
#photoindex-desktop .tagfilters button{border:1px solid var(--line);padding:7px 14px;font-size:13px}
#photoindex-desktop .tagfilters button[aria-pressed=true]{background:var(--selected);color:var(--blue)}
#photoindex-desktop .person-header{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:32px}
#photoindex-desktop .person-header .person-tags{justify-content:flex-start;margin-top:9px}
#photoindex-desktop .person-actions{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
#photoindex-desktop .personchip{padding-left:3px}
#photoindex-desktop .personchip .person-avatar{width:27px;height:27px;font-size:13px}
#photoindex-desktop .personchip .avatar-edit{width:auto;height:auto;padding:0;gap:6px}
#photoindex-desktop dialog.wide-dialog{width:680px}
#photoindex-desktop .crop-sources{display:flex;gap:7px;overflow-x:auto;max-width:100%;margin-bottom:14px}
#photoindex-desktop .crop-sources button{padding:3px;width:66px;height:54px;flex-shrink:0;border:2px solid transparent;border-radius:7px}
#photoindex-desktop .crop-sources button[aria-pressed=true]{border-color:var(--button)}
#photoindex-desktop .crop-sources img{width:100%;height:100%;object-fit:cover;border-radius:3px}
#photoindex-desktop .crop-stage{height:300px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:10px;background:#101113}
#photoindex-desktop .crop-stage>img{display:block;max-width:100%;max-height:100%;user-select:none;pointer-events:none}
#photoindex-desktop .crop-square{position:absolute;border:2px solid #fff;box-shadow:0 0 0 2000px #0007;cursor:move;touch-action:none}
#photoindex-desktop .crop-footer{display:flex;gap:25px;align-items:center;margin-top:18px}
#photoindex-desktop .crop-footer canvas{width:74px;height:74px;border-radius:50%;flex-shrink:0;background:var(--surface)}
#photoindex-desktop .crop-footer label{flex:1;margin:0}
#photoindex-desktop .crop-footer input{padding:0;accent-color:var(--button)}
#photoindex-desktop select{font:inherit;max-width:100%;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:10px;border-radius:8px}
#photoindex-desktop .location-preview{height:170px;border-radius:10px;overflow:hidden;background:var(--surface);position:relative;margin-bottom:6px}
#photoindex-desktop .location-fallback{width:100%;height:100%}
#photoindex-desktop .location-editor-map{height:280px;border-radius:12px;overflow:hidden;background:var(--surface)}
#photoindex-desktop .location-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#photoindex-desktop .location-fields input{min-width:0}
#photoindex-desktop .location-actions{display:flex;align-items:center;justify-content:space-between}
#photoindex-desktop .location-actions button{font-size:12px;padding:5px 7px;color:var(--blue)}
#photoindex-desktop .empty{padding:75px 20px;text-align:center;color:var(--muted)}
#photoindex-desktop .empty h2{color:var(--text);font-size:18px;font-weight:400;margin:15px 0 20px}
#photoindex-desktop .empty>svg{width:36px;height:36px;color:var(--muted)}
#photoindex-desktop .mapbox{height:380px;border-radius:15px;overflow:hidden;background:var(--surface);border:1px solid var(--line);position:relative;margin-bottom:16px}
#photoindex-desktop .mapbox>svg{width:100%;height:100%;display:block}
#photoindex-desktop .mapcontrols{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;background:var(--bg);border-radius:22px;box-shadow:0 1px 6px #0002}
#photoindex-desktop .mapcaption{position:absolute;left:12px;bottom:9px;font-size:10px;color:var(--muted)}
#photoindex-desktop .places{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
#photoindex-desktop .places button{border:1px solid var(--line)}
#photoindex-desktop .places button[aria-pressed=true]{background:var(--selected);color:var(--blue)}
#photoindex-desktop .viewer{background:#101113;color:#f1f3f4;min-height:100dvh;display:flex;flex-direction:column}
#photoindex-desktop .viewerbar{height:68px;display:flex;align-items:center;gap:14px;padding:12px 19px;background:#101113;border-bottom:1px solid #ffffff0f}
#photoindex-desktop .viewerbar .viewertitle{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%;color:#c9cdd3}
#photoindex-desktop .viewerbar .viewertools{display:flex;gap:3px;align-items:center;margin-left:auto}
#photoindex-desktop .viewerbar button:hover,#photoindex-desktop .canvas button:hover{background:#ffffff14}
#photoindex-desktop .viewerbar button[aria-pressed=true]{background:#354257;color:#d3e3fd}
#photoindex-desktop .viewerbody{display:grid;grid-template-columns:minmax(0,1fr) 320px;flex:1;min-height:calc(100dvh - 68px)}
#photoindex-desktop .viewerbody.info-hidden{grid-template-columns:minmax(0,1fr)}
#photoindex-desktop .viewerbody.info-hidden .infopanel{display:none}
#photoindex-desktop .canvas{position:relative;min-width:0;overflow:hidden;min-height:530px;height:calc(100dvh - 68px);max-height:1000px;background:#101113}
#photoindex-desktop .photo-viewport{position:absolute;inset:35px 55px 100px;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#photoindex-desktop .photo-viewport img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-drag:none}
#photoindex-desktop .photo-viewport[data-zoomed=true]{cursor:grab}
#photoindex-desktop .photo-viewport[data-dragging=true]{cursor:grabbing}
#photoindex-desktop .image-nav{position:absolute;top:45%;background:#292b2ee6;border:1px solid #ffffff19;color:#f1f3f4}
#photoindex-desktop .image-nav.previous{left:12px}
#photoindex-desktop .image-nav.next{right:12px}
#photoindex-desktop .zoomtools{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;background:#2a2b2e;border:1px solid #ffffff14;border-radius:27px;padding:3px;color:#e9edf2;z-index:1}
#photoindex-desktop .zoomtools .zoomlevel{font-size:12px;min-width:48px;text-align:center}
#photoindex-desktop .zoomtools button:hover{background:#ffffff18}
#photoindex-desktop .viewer-count{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;color:#9aa0a6}
#photoindex-desktop .infopanel{background:var(--bg);color:var(--text);padding:24px 23px;overflow:auto;max-height:calc(100dvh - 68px);border-left:1px solid var(--line)}
#photoindex-desktop .infoheading{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
#photoindex-desktop .infoheading h2{font-size:19px;font-weight:400}
#photoindex-desktop .infosection{padding:20px 0;border-bottom:1px solid var(--line)}
#photoindex-desktop .infosection:first-of-type{padding-top:0}
#photoindex-desktop .sectionheading{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
#photoindex-desktop .sectionheading h3{font-size:14px;font-weight:500;margin:0}
#photoindex-desktop .sectionheading button{padding:4px 6px;font-size:12px;color:var(--blue)}
#photoindex-desktop .personchips{display:flex;gap:8px;flex-wrap:wrap}
#photoindex-desktop .personchip{display:flex;gap:7px;align-items:center;font-size:12px;background:var(--surface);border-radius:18px;padding:3px 3px 3px 12px}
#photoindex-desktop .personchip button{width:25px;height:25px;padding:4px}
#photoindex-desktop .personchip svg{width:13px;height:13px}
#photoindex-desktop .infoempty{color:var(--muted);font-size:12px;margin:0}
#photoindex-desktop .noteinput{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;font-size:13px}
#photoindex-desktop .notebar{display:flex;justify-content:flex-end;margin-top:7px}
#photoindex-desktop .notebar button{padding:5px 9px;font-size:12px;color:var(--blue)}
#photoindex-desktop .infoitem{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;margin-bottom:18px;font-size:13px}
#photoindex-desktop .infoitem>svg{color:var(--muted);width:18px;height:18px;margin-top:2px}
#photoindex-desktop .infoitem strong{display:block;font-weight:400;overflow-wrap:anywhere}
#photoindex-desktop .infoitem small{display:block;color:var(--muted);font-size:11px;line-height:1.8;overflow-wrap:anywhere;margin-top:3px}
#photoindex-desktop .album-chip{border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px;margin:0 5px 7px 0;display:inline-block}
#photoindex-desktop dialog{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:24px;padding:27px;width:410px;max-width:calc(100vw - 36px);max-height:calc(100dvh - 48px);box-shadow:0 12px 48px #0004;overflow:auto}
#photoindex-desktop dialog::backdrop{background:#10111380}
#photoindex-desktop dialog h2{font-size:22px;font-weight:400;margin:0 0 23px}
#photoindex-desktop dialog label{display:block;font-size:12px;color:var(--muted);margin:17px 0 7px}
#photoindex-desktop dialog input,#photoindex-desktop dialog textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px}
#photoindex-desktop dialog input:focus-visible{outline-offset:0}
#photoindex-desktop .dialogactions{display:flex;justify-content:flex-end;gap:6px;margin-top:25px}
#photoindex-desktop .dialogactions button{padding:10px 18px}
#photoindex-desktop .existingpeople{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
#photoindex-desktop .existingpeople button{border:1px solid var(--line);font-size:12px;padding:7px 11px}
#photoindex-desktop .existingpeople button[aria-pressed=true]{background:var(--selected);color:var(--blue)}
#photoindex-desktop .dialoghint{font-size:12px;color:var(--muted);margin:12px 0 0}
#photoindex-desktop .choice-list{display:grid;gap:6px}
#photoindex-desktop .choice-list label{margin:0;color:var(--text);display:flex;gap:10px;align-items:center;padding:11px 8px;font-size:14px;border-radius:8px}
#photoindex-desktop .choice-list input{width:18px;height:18px;accent-color:var(--button)}
#photoindex-desktop .snackbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#303134;color:#fff;border-radius:7px;padding:12px 22px;box-shadow:0 3px 10px #0003;font-size:13px;z-index:10;max-width:calc(100vw - 28px);text-align:center}
@media(min-width:1400px){#photoindex-desktop .main{padding:32px 50px}#photoindex-desktop .photo-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:1000px){#photoindex-desktop .workspace{grid-template-columns:178px minmax(0,1fr)}#photoindex-desktop .brand{min-width:154px;font-size:19px}#photoindex-desktop .main{padding:27px 24px}#photoindex-desktop .navigation button{gap:13px;padding:13px 16px}#photoindex-desktop .photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}#photoindex-desktop .viewerbody{grid-template-columns:minmax(0,1fr) 285px}#photoindex-desktop .infopanel{padding:20px 19px}#photoindex-desktop .viewerbar .viewertitle{max-width:35%}}
@media(max-width:680px){#photoindex-desktop .topbar{gap:10px;padding:12px 15px;height:70px}#photoindex-desktop .brand{min-width:0;font-size:18px}#photoindex-desktop .brandmark{display:none}#photoindex-desktop .searchbox{height:43px;padding:0 12px}#photoindex-desktop .topactions{gap:0}#photoindex-desktop .topactions button:first-child{display:none}#photoindex-desktop .workspace{grid-template-columns:1fr}#photoindex-desktop .sidebar{padding:8px 10px;gap:0}#photoindex-desktop .navigation{grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}#photoindex-desktop .navigation button{padding:10px 6px;justify-content:center;gap:7px;font-size:13px}#photoindex-desktop .navigation svg{width:17px;height:17px}#photoindex-desktop .sourcearea,#photoindex-desktop .sidefooter{display:none}#photoindex-desktop .main{padding:24px 17px}#photoindex-desktop .photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}#photoindex-desktop .album-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#photoindex-desktop .person-grid{grid-template-columns:repeat(3,minmax(0,1fr))}#photoindex-desktop .viewerbody{display:block}#photoindex-desktop .canvas{height:calc(64dvh - 68px);min-height:360px}#photoindex-desktop .viewerbody.info-hidden .canvas{height:calc(100dvh - 68px)}#photoindex-desktop .infopanel{max-height:none;border-left:0;border-top:1px solid var(--line);padding:24px}#photoindex-desktop .viewerbar .viewertitle{display:none}#photoindex-desktop .viewerbar .viewertools{gap:0}#photoindex-desktop .viewerbar{gap:5px;padding:10px}#photoindex-desktop .viewerbar .textbutton{padding:8px;font-size:12px}#photoindex-desktop .photo-viewport{inset:16px 44px 98px}}
@media(max-width:390px){#photoindex-desktop .brand{font-size:15px}#photoindex-desktop .brand span{white-space:nowrap}#photoindex-desktop .searchbox{padding:0 9px;gap:6px}#photoindex-desktop .searchbox input{font-size:12px}#photoindex-desktop .main{padding:23px 13px}#photoindex-desktop .photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#photoindex-desktop .person-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#photoindex-desktop .viewerbar .viewertools button{padding:7px;font-size:11px}#photoindex-desktop .viewerbar .viewertools .iconbutton{width:35px}}
@media(prefers-reduced-motion:reduce){#photoindex-desktop *{transition:none!important}}
</style>
<style>__MAP_CSS__</style>
<style>
#photoindex-desktop .mapbox.live-map{height:460px}
#photoindex-desktop .maplibregl-ctrl button{padding:0;width:30px;height:30px;border-radius:0;display:block}
#photoindex-desktop .maplibregl-ctrl-attrib-button{width:24px!important;height:24px!important}
#photoindex-desktop .maplibregl-popup-content{background:var(--bg);color:var(--text);border-radius:13px;padding:17px;box-shadow:0 4px 22px #0003}
#photoindex-desktop .maplibregl-popup-close-button{width:25px;height:25px;padding:0;right:4px;top:3px;border-radius:50%}
#photoindex-desktop .map-popup-title{font-size:13px;font-weight:500;padding:0 17px 9px 0}
#photoindex-desktop .map-popup-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
#photoindex-desktop .map-popup-photos button{width:75px;height:64px;border-radius:5px;overflow:hidden;padding:0}
#photoindex-desktop .map-popup-photos img{width:100%;height:100%;object-fit:cover}
#photoindex-desktop .map-popup-note{font-size:11px;color:var(--muted);max-width:240px}
#photoindex-desktop .map-thumbnail{width:57px;height:49px;border-radius:7px;padding:3px;background:var(--bg);box-shadow:0 2px 9px #0005;border:1px solid var(--line);position:relative;overflow:visible}
#photoindex-desktop .map-thumbnail:hover{background:var(--bg)}
#photoindex-desktop .map-thumbnail img{width:100%;height:100%;border-radius:4px;object-fit:cover;display:block}
#photoindex-desktop .map-thumbnail span{position:absolute;right:-6px;top:-7px;border-radius:12px;background:var(--button);color:var(--onbutton);font-size:10px;padding:1px 5px;border:2px solid var(--bg);min-width:20px}
#photoindex-desktop .map-status{position:absolute;top:14px;left:14px;background:var(--bg);color:var(--muted);padding:8px 12px;border-radius:8px;font-size:12px;box-shadow:0 2px 8px #0001;max-width:calc(100% - 70px)}
</style>
</head>
<body>
<div id="photoindex-desktop"><div id="app"></div><dialog id="edit-dialog"></dialog><div class="snackbar" id="snackbar" role="status" hidden></div></div>
<script id="pi-source-data" type="application/json">__PHOTO_DATA__</script>
<script id="pi-geography-data" type="application/json">__GEO_DATA__</script>
<script>__LUCIDE_CODE__</script>
<script>__D3_CODE__</script>
<script>__MAP_CODE__</script>
<script>
(() => {
const root=document.getElementById('photoindex-desktop'),app=root.querySelector('#app'),modal=root.querySelector('#edit-dialog');
const data=JSON.parse(document.getElementById('pi-source-data').textContent),geo=JSON.parse(document.getElementById('pi-geography-data').textContent);
const all=data.photos,samples=all.filter(p=>p.image),months=[...new Set(samples.map(p=>p.month))].sort();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const btn=(action,name,ic,cl='')=>`<button type="button" class="${cl}" data-action="${action}" aria-label="${name}">${ic?icon(ic):''}<span>${name}</span></button>`;
const ib=(a,n,i)=>`<button type="button" class="iconbutton" data-action="${a}" aria-label="${n}">${icon(i)}</button>`;
const label=p=>p.name.replace(/^\d{4}-\d{2}-\d{2}-/,'').replace(/\.(jpg|jpeg)$/i,'');
const state={view:'photos',month:'2022-06',group:'day',query:'',viewer:null,queue:[],info:true,zoom:1,x:0,y:0,place:null,album:null,person:null,mapSelection:null};
const MAP_STYLE=window.lifeMomentsConfig?.mapStyleUrl||{version:8,sources:{},layers:[{id:'background',type:'background',paint:{'background-color':'#eef1f5'}}]};
let liveMap=null,liveMarkers=[],mapCamera=null,miniMap=null,locationMap=null,cropSession=null;
let store={people:[],assignments:{},notes:{},cloudRoot:'/生活点滴/2022',albums:[{name:'毕业季',ids:all.filter(p=>/毕业/.test(p.name)).map(p=>p.id),note:''},{name:'校园四季',ids:all.filter(p=>/校园/.test(p.name)).map(p=>p.id),note:''}]};
try{const saved=window.openai?.widgetState?.privateContent?.previewStore||JSON.parse(localStorage.getItem('photoindex.preview.v2')||'null');if(saved?.albums&&Array.isArray(saved.people))store=saved}catch{}
normalizeStore();
function persist(){if(window.openai?.setWidgetState){window.openai.setWidgetState({modelContent:{people:store.people,view:state.view},privateContent:{previewStore:store}}).catch(()=>{});return}try{localStorage.setItem('photoindex.preview.v2',JSON.stringify(store))}catch{} }
window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent?.previewStore;if(saved?.albums&&Array.isArray(saved.people)){store=saved;normalizeStore();render()}});
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});renderAvatars()}
function flash(text){const e=root.querySelector('#snackbar');e.textContent=text;e.hidden=false;clearTimeout(flash.timer);flash.timer=setTimeout(()=>e.hidden=true,2400)}
function filtered(){let ps=samples;if(state.view==='album')ps=ps.filter(p=>store.albums[state.album].ids.includes(p.id));else if(state.view==='person')ps=ps.filter(p=>(store.assignments[p.id]||[]).includes(state.person));else if(state.view==='map'&&state.mapSelection)ps=ps.filter(p=>state.mapSelection.includes(p.id));else if(state.view==='map'&&state.place)ps=ps.filter(p=>state.place==='西安'?coordinatesFor(p)?.[0]<112:coordinatesFor(p)?.[0]>112);else if(state.view==='photos'&&state.group!=='year')ps=ps.filter(p=>p.month===state.month);if(state.query.trim()){const q=state.query.trim().toLowerCase();ps=ps.filter(p=>(p.name+' '+(store.assignments[p.id]||[]).join(' ')+' '+(store.assignments[p.id]||[]).flatMap(n=>profile(n).tags||[]).join(' ')+' '+(store.notes[p.id]||'')).toLowerCase().includes(q))}return ps}
function grid(ps){return `<div class="photo-grid">${ps.map(p=>`<button type="button" class="photo-tile" data-photo="${p.id}" aria-label="打开 ${esc(p.name)}"><img src="${p.image}" alt="${esc(label(p))}" loading="lazy">${(store.assignments[p.id]||[]).length?`<span class="tagdot">${icon('users-round')}${store.assignments[p.id].length}</span>`:''}</button>`).join('')}</div>`}
function heading(title,action='',subtitle=''){return `<div class="pagehead"><div><h1>${esc(title)}</h1>${subtitle?`<div class="subtitle">${esc(subtitle)}</div>`:''}</div>${action}</div>`}
function render(){disposeMiniMap();if(state.viewer!==null){renderViewer();return}
app.innerHTML=`<header class="topbar"><div class="brand"><span class="brandmark">${icon('images')}</span><span>生活点滴</span></div><label class="searchbox">${icon('search')}<input id="photo-search" type="search" aria-label="搜索照片、人物或批注" placeholder="搜索照片、人物或批注" value="${esc(state.query)}"></label><div class="topactions">${ib('publish','资料发布','package-open')}${ib('mapping','目录设置','settings')}</div></header><div class="workspace"><aside class="sidebar"><nav class="navigation" aria-label="相册导航">${[['photos','image','照片'],['albums','album','相册'],['people','users-round','人物'],['map','map-pin','地点']].map(([v,i,n])=>`<button type="button" data-view="${v}" aria-current="${state.view===v||v==='albums'&&state.view==='album'||v==='people'&&state.view==='person'?'page':'false'}">${icon(i)}${n}</button>`).join('')}</nav><div class="sourcearea"><div class="sidesection">照片来源</div><div class="source"><span>${icon('folder-open')}${esc(data.label||"照片目录")}</span><small>${esc(data.source||"示例照片目录")}</small></div></div><div class="sidefooter">${btn('mapping','目录设置','settings')}${btn('publish','资料发布','package-open')}</div></aside><main class="main" id="content"></main></div>`;
renderContent();icons();app.querySelector('#photo-search').addEventListener('input',e=>{state.query=e.target.value;renderContent();icons()});}
function renderContent(){const main=app.querySelector('#content');if(!main)return;disposeMap();let body='';
if(state.view==='photos'){body=heading('照片',`<div class="segments" aria-label="时间分组">${[['day','日'],['month','月'],['year','年']].map(([v,n])=>`<button type="button" data-group="${v}" aria-pressed="${state.group===v}">${n}</button>`).join('')}</div>`);body+=`<div class="months" aria-label="选择月份">${months.map(m=>`<button type="button" data-month="${m}" aria-pressed="${state.group!=='year'&&m===state.month}">${Number(m.slice(5))}月</button>`).join('')}</div>`;const ps=filtered();if(state.group==='day'){[...new Set(ps.map(p=>p.date))].forEach(d=>{const date=new Date(d+'T12:00:00');body+=`<div class="grouphead"><h2>${Number(d.slice(5,7))}月${Number(d.slice(8))}日，${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][date.getDay()]}</h2><small>2022年</small></div>`+grid(ps.filter(p=>p.date===d))})}else if(state.group==='month')body+=`<div class="grouphead"><h2>2022年${Number(state.month.slice(5))}月</h2></div>`+grid(ps);else body+=`<div class="grouphead"><h2>2022年</h2></div>`+grid(ps);if(!ps.length)body+=empty('没有找到照片');body+='<div class="samplelabel">界面样例 · 35 张照片</div>'}
else if(state.view==='albums'){body=heading('相册',btn('newalbum','新建相册','plus','primary'));body+=`<div class="album-grid">${store.albums.map((a,i)=>{const p=samples.find(p=>a.ids.includes(p.id));return `<button type="button" class="album-card" data-album="${i}">${p?`<img src="${p.image}" alt="${esc(a.name)}">`:`<div class="empty">${icon('album')}</div>`}<div class="title">${esc(a.name)}</div><div class="summary">${a.ids.length} 张照片</div></button>`}).join('')}</div>`}
else if(state.view==='album'){const a=store.albums[state.album];body=heading(a.name,btn('albumnote','编辑批注','notebook-pen','textbutton'));body+=`<div class="album-note">${esc(a.note)}</div>`+grid(filtered());if(!filtered().length)body+=empty('相册中暂无照片')}
else if(state.view==='people'){body=peopleContent()}
else if(state.view==='person'){body=personContent()}
else if(state.view==='map'){const real=!!globalThis.maplibregl;body=heading('地点',btn('gpssettings','位置设置','sliders-horizontal','textbutton'));body+=`<div class="mapbox ${real?'live-map':''}" id="photo-map">${real?'<div class="map-status">正在加载地图…</div>':`<svg class="geography" role="img" aria-label="样例照片的 GPS 分布"></svg><span class="mapcaption">界面预览 · 在线地图请打开 HTML</span>`}</div><div class="places">${['西安','武汉'].map(n=>`<button type="button" data-place="${n}" aria-pressed="${state.place===n}">${icon('map-pin')}${n}</button>`).join('')}${btn('mapreset','全部地点',null)}</div><div id="map-photo-results"><div class="grouphead"><h2>${state.mapSelection?'此位置的照片':state.place||'照片'}</h2></div>${grid(filtered().slice(0,8))}</div>`}
main.innerHTML=body;if(state.view==='map')requestAnimationFrame(drawMap);}
function empty(title,action=''){return `<div class="empty">${icon('images')}<h2>${title}</h2>${action}</div>`}
function renderViewer(){disposeMap();const p=samples.find(p=>p.id===state.viewer);if(!p)return;const idx=state.queue.indexOf(p.id);app.innerHTML=`<section class="viewer" aria-label="照片大图查看"><header class="viewerbar">${ib('closeviewer','返回照片','arrow-left')}<span class="viewertitle">${esc(p.name)}</span><div class="viewertools">${btn('tagperson','添加人物','user-plus')}${ib('addalbum','加入相册','list-plus')}<button type="button" class="iconbutton" data-action="toggleinfo" aria-label="照片信息" aria-pressed="${state.info}">${icon('info')}</button></div></header><div class="viewerbody ${state.info?'':'info-hidden'}"><div class="canvas"><div class="photo-viewport" data-zoomed="false"><img id="large-photo" src="${p.fullImage||p.image}" alt="${esc(p.name)}" draggable="false"></div><button type="button" class="iconbutton image-nav previous" data-action="previous" aria-label="上一张" ${idx<=0?'disabled':''}>${icon('chevron-left')}</button><button type="button" class="iconbutton image-nav next" data-action="next" aria-label="下一张" ${idx>=state.queue.length-1?'disabled':''}>${icon('chevron-right')}</button><div class="zoomtools">${ib('zoomout','缩小','minus')}<span class="zoomlevel">100%</span>${ib('zoomin','放大','plus')}${ib('fit','适应窗口','scan')}</div><div class="viewer-count">${idx+1} / ${state.queue.length}</div></div><aside class="infopanel" aria-label="照片信息"></aside></div></section>`;renderInfo();icons();applyZoom();bindPan();}
function renderInfo(){disposeMiniMap();const panel=app.querySelector('.infopanel');if(!panel)return;const p=samples.find(p=>p.id===state.viewer),people=store.assignments[p.id]||[];panel.innerHTML=`<div class="infoheading"><h2>信息</h2>${ib('toggleinfo','关闭信息','x')}</div><section class="infosection"><div class="sectionheading"><h3>人物</h3>${btn('tagperson','添加','plus','textbutton')}</div><div class="personchips">${people.map(n=>`<span class="personchip"><button type="button" class="avatar-edit" data-avatar-person="${esc(n)}" aria-label="截取 ${esc(n)} 的头像">${avatar(n)}${esc(n)}</button><button type="button" data-remove-person="${esc(n)}" aria-label="移除 ${esc(n)} 的标注">${icon('x')}</button></span>`).join('')}</div>${!people.length?'<p class="infoempty">暂无标注</p>':''}</section><section class="infosection"><div class="sectionheading"><h3>批注</h3></div><textarea id="photo-note" class="noteinput" aria-label="照片批注" placeholder="添加批注">${esc(store.notes[p.id]||'')}</textarea><div class="notebar">${btn('savenote','保存',null,'textbutton')}</div></section><section class="infosection"><div class="sectionheading"><h3>相册</h3>${btn('addalbum','加入','plus','textbutton')}</div>${store.albums.filter(a=>a.ids.includes(p.id)).map(a=>`<span class="album-chip">${esc(a.name)}</span>`).join('')||'<p class="infoempty">未加入相册</p>'}</section><section class="infosection"><div class="infoitem">${icon('calendar')}<div><strong>${p.date}</strong><small>${esc(p.time?.slice(11)||'')}</small></div></div><div class="infoitem">${icon('image')}<div><strong>${esc(p.name)}</strong><small>${p.width} × ${p.height} · ${(p.size/1048576).toFixed(1)} MB</small></div></div>${p.gps?`<div class="sectionheading"><h3>拍摄地点</h3>${btn('editlocation','校准','locate-fixed','textbutton')}</div><div id="photo-location-preview" class="location-preview" aria-label="照片拍摄地点地图预览"></div><div class="location-actions">${btn('viewlocation','在地图中查看','map-pin')}${store.photoLocations[p.id]?.manual?'<small class="infoempty">已校准</small>':''}</div>`:''}<div class="infoitem">${icon('folder')}<div><strong>生活点滴 / 2022</strong><small>本地原片</small></div></div><div class="infoitem">${icon('cloud')}<div><strong>云端原片</strong><small>${esc(store.cloudRoot+'/'+p.name)}<br>未连接百度网盘</small></div></div></section>`;icons();if(p.gps)requestAnimationFrame(()=>{if(state.viewer===p.id)initMiniMap(p)});}
function openViewer(id){state.queue=filtered().map(p=>p.id);if(!state.queue.includes(id))state.queue=samples.map(p=>p.id);state.viewer=id;state.zoom=1;state.x=state.y=0;state.scroll=window.scrollY;renderViewer();window.scrollTo(0,0)}
function closeViewer(){captureNote();state.viewer=null;render();window.scrollTo(0,state.scroll||0)}
function captureNote(){const input=app.querySelector('#photo-note');if(input&&state.viewer!==null)store.notes[state.viewer]=input.value}
function applyZoom(){const img=app.querySelector('#large-photo'),port=app.querySelector('.photo-viewport');if(!img)return;img.style.transform=`translate(${state.x}px,${state.y}px) scale(${state.zoom})`;port.dataset.zoomed=String(state.zoom>1);app.querySelector('.zoomlevel').textContent=`${Math.round(state.zoom*100)}%`;}
function zoom(delta){state.zoom=Math.max(1,Math.min(5,state.zoom+delta));if(state.zoom===1)state.x=state.y=0;applyZoom()}
function bindPan(){const port=app.querySelector('.photo-viewport');let drag=null;port.addEventListener('dblclick',()=>{state.zoom=state.zoom===1?2:1;state.x=state.y=0;applyZoom()});port.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?.2:-.2)},{passive:false});port.addEventListener('pointerdown',e=>{if(state.zoom<=1)return;drag={x:e.clientX,y:e.clientY,ox:state.x,oy:state.y};port.dataset.dragging='true';port.setPointerCapture(e.pointerId)});port.addEventListener('pointermove',e=>{if(!drag)return;state.x=drag.ox+e.clientX-drag.x;state.y=drag.oy+e.clientY-drag.y;applyZoom()});const stop=()=>{drag=null;port.dataset.dragging='false'};port.addEventListener('pointerup',stop);port.addEventListener('pointercancel',stop)}
function openDialog(kind){modal.classList.remove('wide-dialog');captureNote();let title='',content='';if(kind==='tagperson'){if(state.viewer===null)return;title='添加人物';content=`<label for="person-name">姓名</label><input id="person-name" name="value" type="text" autocomplete="off" maxlength="40" required autofocus><div class="existingpeople">${store.people.map(n=>`<button type="button" data-existing="${esc(n)}">${esc(n)}</button>`).join('')}</div>`}
if(kind==='newalbum'){title='新建相册';content='<label for="album-name">相册名称</label><input id="album-name" name="value" type="text" maxlength="60" required autofocus>'}
if(kind==='addalbum'){if(state.viewer===null)return;title='加入相册';content=`<div class="choice-list">${store.albums.map((a,i)=>`<label><input type="checkbox" name="album" value="${i}" ${a.ids.includes(state.viewer)?'checked':''}>${esc(a.name)}</label>`).join('')}</div>`}
if(kind==='albumnote'){title='相册批注';content=`<label for="album-note">批注</label><textarea id="album-note" name="value" rows="5" autofocus>${esc(store.albums[state.album].note||'')}</textarea>`}
if(kind==='mapping'){title='目录设置';content=`<label for="local-path">本地照片目录</label><input id="local-path" type="text" readonly value="${esc(data.source||'')}"><label for="cloud-path">百度网盘照片目录</label><input id="cloud-path" name="value" type="text" value="${esc(store.cloudRoot)}" required pattern="/.*"><p class="dialoghint">保留相对目录结构，用于手机定位已备份的原片。</p>`}
if(kind==='publish'){title='相册资料';content='<p class="dialoghint">索引快照包含人物、相册和批注。原片仍由你现有的备份流程负责。</p><p class="dialoghint">当前为界面预览，尚未实现资料包导出。</p>'}
modal.innerHTML=`<form id="editor-form"><h2>${title}</h2>${content}<div class="dialogactions"><button type="button" data-dismiss class="textbutton">取消</button>${kind==='publish'?'':'<button type="button" data-save class="primary">'+(kind==='tagperson'?'添加':'保存')+'</button>'}</div></form>`;modal.dataset.kind=kind;modal.querySelector('[data-dismiss]').onclick=()=>modal.close();modal.querySelectorAll('[data-existing]').forEach(b=>b.onclick=()=>{modal.querySelector('[name=value]').value=b.dataset.existing;modal.querySelectorAll('[data-existing]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});bindDialogSave(()=>commitDialog(kind));icons();modal.showModal();}
function commitDialog(kind){const value=modal.querySelector('[name=value]')?.value.trim();if(kind==='tagperson'){if(!value)return;if(!store.people.includes(value))store.people.push(value);const ps=store.assignments[state.viewer]||[];if(!ps.includes(value))ps.push(value);store.assignments[state.viewer]=ps;renderInfo();flash('已添加人物')}
if(kind==='newalbum'){if(!value)return;store.albums.push({name:value,ids:[],note:''});renderContent();icons();flash('已创建相册')}
if(kind==='addalbum'){const choices=[...modal.querySelectorAll('[name=album]')];choices.forEach(c=>{const a=store.albums[Number(c.value)];a.ids=a.ids.filter(id=>id!==state.viewer);if(c.checked)a.ids.push(state.viewer)});renderInfo();flash('已更新相册')}
if(kind==='albumnote'){store.albums[state.album].note=value||'';renderContent();icons();flash('已保存批注')}
if(kind==='mapping'){if(!value?.startsWith('/'))return;store.cloudRoot=value.replace(/\/$/,'');if(state.viewer!==null)renderInfo();flash('已保存目录设置')}
persist();modal.close()}
root.addEventListener('click',e=>{if(modal.open&&e.target.closest('dialog'))return;const b=e.target.closest('button');if(!b)return;
if(b.dataset.photo){openViewer(Number(b.dataset.photo));return}
if(b.dataset.view){disposeMap();state.view=b.dataset.view;state.query='';state.place=null;state.mapSelection=null;mapCamera=null;render();return}
if(b.dataset.group){state.group=b.dataset.group;renderContent();icons();return}
if(b.dataset.month){state.month=b.dataset.month;if(state.group==='year')state.group='month';renderContent();icons();return}
if(b.dataset.album!==undefined){state.album=Number(b.dataset.album);state.view='album';render();return}
if(b.dataset.person){state.person=b.dataset.person;state.view='person';render();return}
if(b.dataset.personTag!==undefined){state.personTag=state.personTag===b.dataset.personTag?null:b.dataset.personTag;renderContent();icons();return}
if(b.dataset.avatarPerson){openAvatar(b.dataset.avatarPerson,state.viewer);return}
if(b.dataset.place){disposeMap();state.place=b.dataset.place;state.mapSelection=null;mapCamera=null;renderContent();icons();return}
if(b.dataset.removePerson){captureNote();store.assignments[state.viewer]=(store.assignments[state.viewer]||[]).filter(n=>n!==b.dataset.removePerson);persist();renderInfo();return}
const a=b.dataset.action;if(a==='avatar'){openAvatar(state.person);return}if(a==='personlabels'){openPersonTags();return}if(a==='gpssettings'){openGpsSettings();return}if(a==='editlocation'){openLocationEditor();return}if(a==='viewlocation'){captureNote();const p=samples.find(p=>p.id===state.viewer);state.viewer=null;state.view='map';state.place=null;state.mapSelection=[p.id];disposeMap();mapCamera={center:coordinatesFor(p),zoom:16};render();return}if(['tagperson','newalbum','addalbum','albumnote','mapping','publish'].includes(a)){openDialog(a);return}
if(a==='closeviewer')closeViewer();if(a==='backphotos'){state.view='photos';render()}
if(a==='toggleinfo'){captureNote();state.info=!state.info;app.querySelector('.viewerbody').classList.toggle('info-hidden',!state.info);app.querySelector('[data-action=toggleinfo]').setAttribute('aria-pressed',String(state.info));if(state.info)requestAnimationFrame(()=>miniMap?.resize())}
if(a==='savenote'){captureNote();persist();flash('已保存批注')}
if(a==='zoomin')zoom(.5);if(a==='zoomout')zoom(-.5);if(a==='fit'){state.zoom=1;state.x=state.y=0;applyZoom()}
if(a==='previous'||a==='next'){captureNote();const idx=state.queue.indexOf(state.viewer)+(a==='next'?1:-1);if(idx>=0&&idx<state.queue.length){state.viewer=state.queue[idx];state.zoom=1;state.x=state.y=0;renderViewer()}}
if(a==='mapreset'){state.place=null;state.mapSelection=null;mapCamera=null;disposeMap();mapCamera=null;renderContent();icons()}
});
document.addEventListener('keydown',e=>{if(modal.open||e.target.matches('input,textarea,select')||state.viewer===null)return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft')app.querySelector('[data-action=previous]')?.click();if(e.key==='ArrowRight')app.querySelector('[data-action=next]')?.click();if(e.key==='+'||e.key==='=')zoom(.5);if(e.key==='-')zoom(-.5)});
function drawMap(){if(globalThis.maplibregl){if(liveMap)liveMap.resize();else initLiveMap();return}const svg=app.querySelector('.geography');if(!svg||!globalThis.d3)return;const w=svg.clientWidth,h=380,s=d3.select(svg);s.selectAll('*').remove();svg.setAttribute('viewBox',`0 0 ${w} ${h}`);const region=state.place?geo.features.find(f=>f.properties.name.includes(state.place==='西安'?'陕西':'湖北')):geo;const proj=d3.geoMercator().fitExtent([[18,18],[w-18,h-18]],region||geo),path=d3.geoPath(proj);s.append('g').selectAll('path').data(geo.features).join('path').attr('d',path).attr('fill','var(--bg)').attr('stroke','var(--line)').attr('stroke-width',.8);const defs=s.append('defs');['西安','武汉'].forEach((name,i)=>{const ps=all.filter(p=>name==='西安'?coordinatesFor(p)?.[0]<112:coordinatesFor(p)?.[0]>112);const [x,y]=proj([d3.mean(ps,p=>coordinatesFor(p)[0]),d3.mean(ps,p=>coordinatesFor(p)[1])]);const grad=defs.append('radialGradient').attr('id','heat'+i);grad.append('stop').attr('offset','0%').attr('stop-color','var(--button)').attr('stop-opacity',.52);grad.append('stop').attr('offset','100%').attr('stop-color','var(--button)').attr('stop-opacity',0);s.append('circle').attr('cx',x).attr('cy',y).attr('r',26+Math.sqrt(ps.length)*2.2).attr('fill',`url(#heat${i})`);s.append('circle').attr('cx',x).attr('cy',y).attr('r',6).attr('fill','var(--button)');s.append('text').attr('x',x+(i?12:-12)).attr('y',y-12).attr('text-anchor',i?'start':'end').attr('fill','var(--text)').attr('font-size',13).text(name)});}
function disposeMap(){liveMarkers.forEach(m=>m.remove());liveMarkers=[];if(liveMap){mapCamera={center:liveMap.getCenter().toArray(),zoom:liveMap.getZoom()};liveMap.remove();liveMap=null}}
function mapFeatures(){const groups=new Map();all.forEach(p=>{const coords=coordinatesFor(p);if(!coords)return;const key=coords.map(v=>v.toFixed(6)).join(',');if(!groups.has(key))groups.set(key,{coords,ids:[]});groups.get(key).ids.push(p.id)});return {type:'FeatureCollection',features:[...groups.values()].map((g,i)=>({type:'Feature',id:i,geometry:{type:'Point',coordinates:g.coords},properties:{count:g.ids.length,ids:JSON.stringify(g.ids)}}))}}
function locationPopup(feature){if(!liveMap)return;const ids=typeof feature.properties.ids==='string'?JSON.parse(feature.properties.ids):feature.properties.ids;state.mapSelection=ids;const ps=samples.filter(p=>ids.includes(p.id));const container=document.createElement('div');container.innerHTML=`<div class="map-popup-title">此位置 · ${ids.length} 张照片</div><div class="map-popup-photos">${ps.map(p=>`<button type="button" data-map-photo="${p.id}" aria-label="查看 ${esc(p.name)}"><img src="${p.image}" alt="${esc(label(p))}"></button>`).join('')}</div>${ps.length<ids.length?`<div class="map-popup-note">当前包含 ${ps.length} 张样例预览</div>`:''}`;container.querySelectorAll('[data-map-photo]').forEach(b=>b.onclick=()=>openViewer(Number(b.dataset.mapPhoto)));new maplibregl.Popup({maxWidth:'300px',offset:15}).setLngLat(feature.geometry.coordinates).setDOMContent(container).addTo(liveMap);const result=app.querySelector('#map-photo-results');if(result){result.innerHTML=`<div class="grouphead"><h2>此位置的照片</h2><small>${ids.length} 张</small></div>`+grid(ps);icons()}}
function initLiveMap(){const container=app.querySelector('#photo-map');if(!container||liveMap)return;const status=container.querySelector('.map-status');let map;
try{map=new maplibregl.Map({container,style:MAP_STYLE,center:mapCamera?.center||[111.5,32.5],zoom:mapCamera?.zoom||5.4,attributionControl:true,localIdeographFontFamily:'Microsoft YaHei',renderWorldCopies:false});liveMap=map;map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');map.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-left')}catch{status.textContent='当前浏览器无法显示地图，请使用支持 WebGL 的浏览器。';return}
map.on('error',e=>{if(status?.isConnected&&(e.error?.status===401||e.error?.status===403)){status.hidden=false;status.textContent='地图访问被拒绝，请检查密钥和允许访问的域名。'}});
map.on('load',()=>{if(liveMap!==map)return;status.hidden=!!window.lifeMomentsConfig?.mapStyleUrl;if(!status.hidden)status.textContent='地图背景未配置，仍可查看照片位置';const photos=mapFeatures();map.addSource('photo-heat',{type:'geojson',data:photos});map.addSource('photo-clusters',{type:'geojson',data:photos,cluster:true,clusterMaxZoom:14,clusterRadius:50,clusterProperties:{photo_count:['+',['get','count']]}});
map.addLayer({id:'photos-heatmap',type:'heatmap',source:'photo-heat',maxzoom:11,paint:{'heatmap-weight':['sqrt',['get','count']],'heatmap-intensity':['interpolate',['linear'],['zoom'],3,.7,10,1.7],'heatmap-radius':['interpolate',['linear'],['zoom'],3,20,10,45],'heatmap-opacity':['interpolate',['linear'],['zoom'],8,.8,11,0],'heatmap-color':['interpolate',['linear'],['heatmap-density'],0,'rgba(59,130,246,0)',.2,'rgba(59,130,246,.45)',.5,'rgba(38,166,154,.85)',.75,'rgba(255,193,7,.9)',1,'rgba(239,83,80,.96)']}});
map.addLayer({id:'photos-clusters',type:'circle',source:'photo-clusters',filter:['has','point_count'],minzoom:7,paint:{'circle-color':'#1a73e8','circle-radius':['step',['get','photo_count'],18,10,22,50,28],'circle-stroke-color':'#fff','circle-stroke-width':2}});
if(typeof MAP_STYLE==='string'||MAP_STYLE.glyphs)map.addLayer({id:'photos-cluster-count',type:'symbol',source:'photo-clusters',filter:['has','point_count'],minzoom:7,layout:{'text-field':['to-string',['get','photo_count']],'text-font':['Noto Sans Regular'],'text-size':13},paint:{'text-color':'#fff'}});
map.addLayer({id:'photos-points',type:'circle',source:'photo-clusters',filter:['!', ['has','point_count']],minzoom:9,paint:{'circle-color':'#1a73e8','circle-radius':7,'circle-stroke-color':'#fff','circle-stroke-width':2}});
map.on('click','photos-clusters',async e=>{const f=e.features[0];const z=await map.getSource('photo-clusters').getClusterExpansionZoom(f.properties.cluster_id);if(liveMap===map)map.easeTo({center:f.geometry.coordinates,zoom:z,duration:400})});map.on('click','photos-points',e=>locationPopup(e.features[0]));['photos-clusters','photos-points'].forEach(layer=>{map.on('mouseenter',layer,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',layer,()=>map.getCanvas().style.cursor='')});
const updateThumbnails=()=>{liveMarkers.forEach(m=>m.remove());liveMarkers=[];if(liveMap!==map||map.getZoom()<13)return;const bounds=map.getBounds();photos.features.filter(f=>bounds.contains(f.geometry.coordinates)).forEach(f=>{const ids=JSON.parse(f.properties.ids),p=samples.find(p=>ids.includes(p.id));if(!p)return;const el=document.createElement('button');el.type='button';el.className='map-thumbnail';el.setAttribute('aria-label',`查看此位置的 ${f.properties.count} 张照片`);el.innerHTML=`<img src="${p.image}" alt="${esc(label(p))}"><span>${f.properties.count}</span>`;el.onclick=e=>{e.stopPropagation();locationPopup(f)};liveMarkers.push(new maplibregl.Marker({element:el}).setLngLat(f.geometry.coordinates).addTo(map))})};map.on('moveend',updateThumbnails);
if(!mapCamera){const ps=all.filter(p=>coordinatesFor(p)&&(!state.place||(state.place==='西安'?coordinatesFor(p)[0]<112:coordinatesFor(p)[0]>112)));const bounds=new maplibregl.LngLatBounds();ps.forEach(p=>bounds.extend(coordinatesFor(p)));if(ps.length)map.fitBounds(bounds,{padding:60,maxZoom:13,duration:0})}updateThumbnails();container.dataset.loaded='true';});}

window.addEventListener('resize',()=>{if(state.view==='map'&&state.viewer===null)drawMap()});render();
})();
